// ── Print Preview ─────────────────────────────────────────────
function PrintPreview({employees,fortnightStart,getTimesheet,getExpenses,getMedCerts,onClose}){
  const[sel,setSel]=useState("all");
  const empList=sel==="all"?employees.map(e=>e.name):[sel];
  const period=fmtDate(fortnightStart)+" – "+fmtDate(fortnightStart,13);
  const emailFn=()=>{const s=encodeURIComponent("Fortnightly Payroll Summary – "+period);const b=encodeURIComponent("Hi Remon,\n\nPlease find attached the fortnightly payroll summary for the period: "+period+"\n\nEmployee(s): "+empList.join(", ")+"\n\nKind regards");window.location.href="mailto:remon@rawsonstkids.nsw.edu.au?subject="+s+"&body="+b;};
  const printFn=()=>{const area=document.getElementById("print-area");if(!area)return;const html="<!DOCTYPE html><html><head><title>iRSK Payroll</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#1e293b;margin:24px}table{width:100%;border-collapse:collapse;margin-bottom:10px}th{background:#f1f5f9;text-align:left;padding:6px 8px;font-size:11px;color:#475569;border:1px solid #e2e8f0}td{padding:5px 8px;border:1px solid #e2e8f0;font-size:11px}img{max-width:120px;max-height:120px;object-fit:cover}@media print{body{margin:12px}}</style></head><body>"+area.innerHTML+"<script>setTimeout(function(){window.print();},500);<\/script></body></html>";const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();}};
  const td={padding:"5px 8px",border:"1px solid #e2e8f0",fontSize:"0.72rem"};
  const th={textAlign:"left",padding:"5px 8px",fontSize:"0.7rem",color:"#475569",border:"1px solid #e2e8f0",background:"#f1f5f9"};
  const dv=d=>{if(d.status==="Public Holiday")return"PH";if(d.status==="Annual Leave")return"AL";if(d.status==="Sick Leave")return"SL";if(d.status==="Day Off")return"OFF";if(d.status==="Weekend")return"—";if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return toDec(m);}if(d.decimalHours)return parseFloat(d.decimalHours).toFixed(2);return"—";};
  const wt=days=>days.reduce((s,d)=>{if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return s+m/60;}if(d.decimalHours&&d.status==="Worked")return s+parseFloat(d.decimalHours);return s;},0);
  const wl=off=>{if(!fortnightStart)return off===0?"Week 1":"Week 2";const d=new Date(fortnightStart+"T12:00:00");d.setDate(d.getDate()+off);const e=new Date(d);e.setDate(d.getDate()+4);return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"2-digit",month:"2-digit"})+" – "+e.toLocaleDateString("en-AU",{timeZone:SYD,day:"2-digit",month:"2-digit"});};
  return(
    <div style={{position:"fixed",inset:0,zIndex:50,display:"flex",flexDirection:"column",background:"#f1f5f9"}}>
      <div style={{flexShrink:0,display:"flex",alignItems:"center",gap:12,padding:"0.75rem 1.25rem",background:"white",borderBottom:"1px solid #e2e8f0",flexWrap:"wrap"}}>
        <span style={{fontWeight:700,color:"#334155"}}>🖨️ Print Preview</span>
        <div style={{display:"flex",alignItems:"center",gap:8,marginLeft:8}}>
          <label style={{fontSize:"0.75rem",color:"#64748b"}}>Employee:</label>
          <select value={sel} onChange={e=>setSel(e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.25rem 0.75rem",fontSize:"0.875rem"}}>
            <option value="all">All Employees</option>{employees.map(e=><option key={e.name} value={e.name}>{e.name}</option>)}
          </select>
        </div>
        <div style={{marginLeft:"auto",display:"flex",gap:8}}>
          <button onClick={emailFn} style={{padding:"0.4rem 1rem",borderRadius:"0.5rem",background:"#f1f5f9",color:"#475569",fontWeight:600,fontSize:"0.8rem",border:"none",cursor:"pointer"}}>📧 Email</button>
          <button onClick={printFn} style={{padding:"0.4rem 1rem",borderRadius:"0.5rem",background:BRAND,color:"white",fontWeight:600,fontSize:"0.8rem",border:"none",cursor:"pointer"}}>🖨️ Print / Save PDF</button>
          <button onClick={onClose} style={{padding:"0.4rem 1rem",borderRadius:"0.5rem",background:"#f1f5f9",color:"#64748b",fontSize:"0.8rem",border:"none",cursor:"pointer"}}>✕ Close</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:24,display:"flex",justifyContent:"center"}}>
        <div id="print-area" style={{background:"white",width:"100%",maxWidth:800,padding:32,borderRadius:8,boxShadow:"0 2px 16px rgba(0,0,0,0.08)",fontFamily:"Arial,sans-serif",fontSize:12,color:"#1e293b"}}>
          <div style={{marginBottom:16}}><div style={{color:BRAND,fontSize:22,fontWeight:900}}>Rawson St Kids Early Learning Centre</div><div style={{color:"#64748b",fontSize:11}}>iRSK — Fortnightly Payroll Summary</div><div style={{color:"#334155",fontSize:12,marginTop:4}}>Period: {period}</div><div style={{color:"#94a3b8",fontSize:10,marginTop:2}}>Generated: {fmtGen()}</div></div>
          {(()=>{let gt=0,ts=0,ta=0,tp=0,tw=0;empList.forEach(emp=>{const sheet=getTimesheet(emp);sheet.forEach(d=>{if(d.status==="Sick Leave")ts++;else if(d.status==="Annual Leave")ta++;else if(d.status==="Public Holiday")tp++;else if(d.status==="Worked"){tw++;if(d.start&&d.end){const[sh,sm]=d.start.split(":").map(Number);const[eh,em]=d.end.split(":").map(Number);const m=(eh*60+em)-(sh*60+sm)-roundBrk(d.breakMins);if(m>0)gt+=m/60;}else if(d.decimalHours)gt+=parseFloat(d.decimalHours)||0;}});});
          return(<div style={{background:"#f8fafc",border:"2px solid "+BRAND,borderRadius:8,padding:14,marginBottom:20}}><div style={{fontWeight:700,fontSize:13,color:"#1e293b",marginBottom:10,borderBottom:"1px solid #e2e8f0",paddingBottom:6}}>📊 Fortnight Summary — {empList.length} Staff</div><div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{[{v:gt.toFixed(2),l:"Total Hours",bg:"#fee2e2",c:BRAND},{v:(gt/Math.max(empList.length,1)).toFixed(2),l:"Avg Hrs/Staff",bg:"#fef3c7",c:"#d97706"},{v:tw,l:"Days Worked",bg:"#eff6ff",c:"#3b82f6"},{v:tp,l:"Public Holidays",bg:"#fef9c3",c:"#b45309"},{v:ta,l:"Annual Leave",bg:"#f0fdf4",c:"#16a34a"},{v:ts,l:"Sick Leave",bg:"#fff1f2",c:"#e11d48"}].map(({v,l,bg,c})=><div key={l} style={{background:bg,borderRadius:6,padding:"6px 12px",textAlign:"center",flex:1,minWidth:75}}><div style={{fontSize:17,fontWeight:800,color:c}}>{v}</div><div style={{fontSize:10,color:c,marginTop:1}}>{l}</div></div>)}</div></div>);})()}
          {empList.map((emp,ei)=>{
            const sheet=getTimesheet(emp);const w1=sheet.slice(0,5);const w2=sheet.slice(7,12);const grand=wt(w1)+wt(w2);
            const ph=sheet.filter(d=>d.status==="Public Holiday").length;const al=sheet.filter(d=>d.status==="Annual Leave").length;const sl=sheet.filter(d=>d.status==="Sick Leave").length;
            const ee=getExpenses(emp);const ec=getMedCerts(emp);const et=ee.reduce((s,e)=>s+parseFloat(e.amount),0);
            return(<div key={emp} style={{marginBottom:32,borderTop:ei>0?"2px dashed #e2e8f0":"none",paddingTop:ei>0?20:0}}>
              <div style={{fontSize:14,fontWeight:700,borderBottom:"2px solid "+BRAND,paddingBottom:4,marginBottom:10}}>{emp}</div>
              <table style={{width:"100%",borderCollapse:"collapse",marginBottom:10}}><thead><tr><th style={th}>Week</th>{["Mon","Tue","Wed","Thu","Fri"].map(d=><th key={d} style={th}>{d}</th>)}<th style={th}>Total</th></tr></thead>
              <tbody>{[{days:w1,off:0},{days:w2,off:7}].map(({days,off})=><tr key={off} style={{background:off===0?"#f8fafc":"white"}}><td style={{...td,fontWeight:600,color:"#475569"}}>{wl(off)}</td>{days.map((d,i)=><td key={i} style={{...td,color:d.status==="Public Holiday"?"#b45309":d.status==="Annual Leave"?"#15803d":d.status==="Sick Leave"?"#dc2626":d.status==="Day Off"?"#94a3b8":"#1e293b",fontWeight:d.status==="Worked"?600:"normal"}}>{dv(d)}</td>)}<td style={{...td,fontWeight:700,color:BRAND}}>{wt(days).toFixed(2)}</td></tr>)}</tbody></table>
              <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:14}}>{[{v:grand.toFixed(2),l:"Normal Hours"},{v:ph,l:"Public Holidays"},{v:al,l:"Annual Leave"},{v:sl,l:"Sick Leave"}].map(({v,l})=><div key={l} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 12px",textAlign:"center",minWidth:75}}><div style={{fontSize:15,fontWeight:700,color:BRAND}}>{v}</div><div style={{fontSize:10,color:"#64748b"}}>{l}</div></div>)}</div>
              {ee.length>0&&<div style={{marginBottom:14}}><div style={{fontSize:11,fontWeight:700,color:"#475569",marginBottom:5,borderBottom:"1px solid #e2e8f0",paddingBottom:2}}>💰 Expenses</div><table style={{width:"100%",borderCollapse:"collapse",marginBottom:4}}><thead><tr>{["Date","Description","Amount","Receipt"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead><tbody>{ee.map((ex,i)=><tr key={ex.id} style={{background:i%2===0?"white":"#f8fafc"}}><td style={td}>{ex.date}</td><td style={td}>{ex.name}</td><td style={{...td,fontWeight:600,color:BRAND}}>${ex.amount}</td><td style={td}>{ex.receipt?.type==="image"?<img src={ex.receipt.data} style={{maxWidth:90,maxHeight:90,borderRadius:4,objectFit:"cover"}}/>:ex.receipt?.type==="file"?<span>📄 {ex.receipt.name}</span>:"—"}</td></tr>)}</tbody></table><div style={{textAlign:"right",fontWeight:700,color:BRAND,fontSize:11}}>Total: ${et.toFixed(2)}</div></div>}
              {ec.length>0&&<div><div style={{fontSize:11,fontWeight:700,color:"#475569",marginBottom:6,borderBottom:"1px solid #e2e8f0",paddingBottom:2}}>🏥 Medical Certificates</div><div style={{display:"flex",flexWrap:"wrap",gap:10}}>{ec.map(c=><div key={c.id}>{c.type==="image"?<div><img src={c.data} style={{maxWidth:150,maxHeight:150,borderRadius:6,border:"1px solid #e2e8f0",objectFit:"cover"}}/><div style={{fontSize:9,color:"#64748b",marginTop:2}}>{c.name}</div></div>:<div style={{background:"#f1f5f9",border:"1px solid #e2e8f0",borderRadius:6,padding:"10px 14px",fontSize:11,color:"#475569"}}>📄 {c.name}</div>}</div>)}</div></div>}
            </div>);
          })}
          <div style={{marginTop:24,fontSize:10,color:"#94a3b8",borderTop:"1px solid #e2e8f0",paddingTop:8}}>Generated by iRSK • {fmtGen()}</div>
        </div>
      </div>
    </div>
  );
}

// ── Entries by Day View ───────────────────────────────────────
// Shows the same fortnight timesheet data, but pivoted: pick a day (1 of 14 in the cycle),
// and see every employee's entry for that day. Admin/Director can edit inline.
function EntriesByDay({employees,fortnightStart,getTimesheet,updateDay,canEditFor,isLocked}){
  // Default to today if it falls in the cycle, else day 0
  const defaultIdx=(()=>{
    if(!fortnightStart)return 0;
    const today=todaySyd();
    const diff=daysBetween(fortnightStart,today);
    if(diff>=0&&diff<14)return diff;
    return 0;
  })();
  const[dayIdx,setDayIdx]=useState(defaultIdx);

  // Recompute default if cycle changes
  useEffect(()=>{setDayIdx(defaultIdx);},[fortnightStart]);

  // Build the 14 day tabs
  const dayTabs=Array.from({length:14},(_,i)=>i);

  // Build the rows: one per employee for the selected day
  // Sort order:
  //  1. Worked with an In time → earliest In first
  //  2. Worked but no In time yet (e.g. imported decimal-hours only, or not yet filled) → after timed entries
  //  3. Public Holiday → Annual Leave → Sick Leave → Day Off → Weekend (not-working last)
  //  4. Name as alphabetical tiebreaker
  const statusOrder={"Worked":0,"Public Holiday":1,"Annual Leave":2,"Sick Leave":3,"Day Off":4,"Weekend":5};
  const toMin=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);if(isNaN(h)||isNaN(m))return null;return h*60+m;};
  const rows=employees.map(emp=>{
    const sheet=getTimesheet(emp.name);
    const day=sheet[dayIdx]||defDay(isWE(dayIdx,fortnightStart));
    return{empName:emp.name,day};
  }).sort((a,b)=>{
    const sa=statusOrder[a.day.status]??99;
    const sb=statusOrder[b.day.status]??99;
    if(sa!==sb)return sa-sb;
    // Within "Worked", sort by start time — entries with no start time go to the bottom of the worked group
    if(a.day.status==="Worked"){
      const ta=toMin(a.day.start);
      const tb=toMin(b.day.start);
      if(ta!==null&&tb!==null&&ta!==tb)return ta-tb;
      if(ta!==null&&tb===null)return -1;
      if(ta===null&&tb!==null)return 1;
    }
    return a.empName.localeCompare(b.empName);
  });

  // Aggregate stats for this day
  const stats=(()=>{
    let totalHrs=0,worked=0,sick=0,annual=0,ph=0,off=0;
    rows.forEach(({day})=>{
      if(day.status==="Sick Leave")sick++;
      else if(day.status==="Annual Leave")annual++;
      else if(day.status==="Public Holiday")ph++;
      else if(day.status==="Day Off")off++;
      else if(day.status==="Worked"){
        worked++;
        if(day.start&&day.end){const m=calcH(day.start,day.end,day.breakMins);if(m!=null)totalHrs+=m/60;}
        else if(day.decimalHours)totalHrs+=parseFloat(day.decimalHours)||0;
      }
    });
    return{totalHrs,worked,sick,annual,ph,off};
  })();

  const dayIsWE=isWE(dayIdx,fortnightStart);
  const dayLabel=fmtDayLong(dayIdx,fortnightStart);

  return(
    <div style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)"}}>
      <div style={{fontWeight:600,color:BRAND,marginBottom:12,fontSize:"1rem",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span>📆 Entries by Day</span>
        <span style={{fontSize:"0.75rem",color:"#1e293b",fontWeight:500}}>— {dayLabel}</span>
        {dayIsWE&&<span style={{fontSize:"0.7rem",fontWeight:700,padding:"2px 8px",borderRadius:999,background:"#e2e8f0",color:"#64748b"}}>Weekend</span>}
        {isLocked&&<span style={{fontSize:"0.7rem",fontWeight:700,padding:"2px 8px",borderRadius:999,background:"#fef3c7",color:"#92400e"}}>🔒 locked</span>}
      </div>

      {/* Day picker — 14 tabs, week 1 then week 2 */}
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
        {[0,7].map(weekStart=>(
          <div key={weekStart} style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            <span style={{fontSize:"0.65rem",fontWeight:700,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.05em",width:46,alignSelf:"center"}}>Wk {weekStart===0?1:2}</span>
            {dayTabs.slice(weekStart,weekStart+7).map(i=>{
              const sel=i===dayIdx;
              const we=isWE(i,fortnightStart);
              const today=todaySyd();
              const isToday=fortnightStart&&addDays(fortnightStart,i)===today;
              return(
                <button key={i} onClick={()=>setDayIdx(i)} style={{
                  padding:"4px 10px",borderRadius:"0.5rem",fontSize:"0.75rem",fontWeight:sel?700:500,
                  border:"1px solid "+(sel?BRAND:isToday?"#fbbf24":"#e2e8f0"),
                  background:sel?BRAND:we?"#f1f5f9":"white",
                  color:sel?"white":we?"#94a3b8":"#475569",
                  cursor:"pointer",flex:1,minWidth:64,position:"relative"
                }}>
                  {fmtDay(i,fortnightStart).replace(/,/g,"")}
                  {isToday&&!sel&&<span style={{position:"absolute",top:-4,right:-4,width:8,height:8,background:"#fbbf24",borderRadius:"50%",border:"1px solid white"}}></span>}
                </button>
              );
            })}
          </div>
        ))}
      </div>

      {/* Day-level stats */}
      <div className="app-stats-4" style={{marginBottom:14,gap:8}}>
        {[
          {v:stats.totalHrs.toFixed(2),l:"Total hrs",bg:"#fee2e2",c:BRAND},
          {v:stats.worked,l:"Worked",bg:"#eff6ff",c:"#3b82f6"},
          {v:stats.sick+stats.annual+stats.ph,l:"On leave",bg:"#fef9c3",c:"#b45309"},
          {v:stats.off,l:"Off",bg:"#f3f4f6",c:"#94a3b8"}
        ].map(({v,l,bg,c})=>(
          <div key={l} style={{background:bg,borderRadius:"0.6rem",padding:"0.5rem",textAlign:"center"}}>
            <div style={{fontSize:"1.1rem",fontWeight:700,color:c}}>{v}</div>
            <div style={{fontSize:"0.65rem",color:c,marginTop:1}}>{l}</div>
          </div>
        ))}
      </div>

      {/* Employee rows for the selected day */}
      {rows.length===0
        ?<div style={{textAlign:"center",color:"#94a3b8",padding:"2rem 0",fontSize:"0.875rem"}}>No employees yet</div>
        :<div style={{display:"flex",flexDirection:"column",gap:6}}>
          {rows.map(({empName,day})=>{
            const editable=canEditFor(empName)&&!dayIsWE;
            const imported=day.decimalHours&&parseFloat(day.decimalHours)>0&&day.status==="Worked";
            const[bg,bc]=sCol(dayIsWE?"Weekend":day.status);
            const sb2=sBadge(dayIsWE?"Weekend":day.status);
            return(
              <div key={empName} style={{border:"1px solid "+bc,borderRadius:"0.75rem",padding:10,background:bg,opacity:dayIsWE?0.65:1}}>
                <div className="app-day-row">
                  <span style={{fontSize:"0.8rem",fontWeight:600,color:"#1e293b",width:"8rem",flexShrink:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{empName}</span>

                  {dayIsWE
                    ?<span style={{...sb2,fontSize:"0.75rem",fontWeight:500,padding:"2px 8px",borderRadius:6}}>Weekend</span>
                    :editable
                      ?<select value={day.status} onChange={e=>updateDay(empName,dayIdx,"status",e.target.value)} style={{...sb2,fontSize:"0.75rem",fontWeight:500,padding:"2px 8px",borderRadius:6,border:"none",cursor:"pointer"}}>{DAY_STATUS.filter(s=>s!=="Weekend").map(s=><option key={s}>{s}</option>)}</select>
                      :<span style={{...sb2,fontSize:"0.75rem",fontWeight:500,padding:"2px 8px",borderRadius:6}}>{day.status}</span>
                  }

                  {day.status==="Worked"&&!dayIsWE&&(<>
                    {imported?(
                      <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontSize:"0.75rem",fontWeight:600,padding:"2px 8px",borderRadius:6,background:"#dbeafe",color:"#1d4ed8",border:"1px solid #bfdbfe"}}>📊 {(()=>{const m=calcH(day.start,day.end,day.breakMins);return m!=null?toDec(m)+"h | "+toHM(m):decToHM(day.decimalHours);})()}</span>
                        {day.start&&<span style={{fontSize:"0.7rem",color:"#94a3b8"}}>In: <span style={{color:"#334155",fontWeight:500}}>{day.start}</span></span>}
                        {day.end&&<span style={{fontSize:"0.7rem",color:"#94a3b8"}}>Out: <span style={{color:"#334155",fontWeight:500}}>{day.end}</span></span>}
                        {day.breakMins&&<span style={{fontSize:"0.7rem",padding:"2px 6px",borderRadius:6,background:"#fff7ed",color:"#ea580c",border:"1px solid #fed7aa"}}>☕ {day.breakMins} min</span>}
                        {editable&&<button onClick={()=>updateDay(empName,dayIdx,"decimalHours","")} style={{marginLeft:"auto",fontSize:"0.7rem",background:"none",border:"none",cursor:"pointer",color:"#94a3b8"}}>Edit manually</button>}
                      </div>
                    ):(<>
                      <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:"0.7rem",color:"#94a3b8"}}>In</span><input type="time" value={day.start} disabled={!editable} onChange={e=>updateDay(empName,dayIdx,"start",e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 6px",fontSize:"0.75rem",outline:"none",background:editable?"white":"#f8fafc"}}/></div>
                      <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:"0.7rem",color:"#94a3b8"}}>Out</span><input type="time" value={day.end} disabled={!editable} onChange={e=>updateDay(empName,dayIdx,"end",e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 6px",fontSize:"0.75rem",outline:"none",background:editable?"white":"#f8fafc"}}/></div>
                      <div style={{display:"flex",alignItems:"center",gap:4}}><span style={{fontSize:"0.7rem",color:"#94a3b8"}}>Break</span><input type="number" min="30" max="120" placeholder="mins" value={day.breakMins} disabled={!editable} onChange={e=>updateDay(empName,dayIdx,"breakMins",e.target.value)} style={{border:"1px solid #e2e8f0",borderRadius:6,padding:"2px 6px",fontSize:"0.75rem",width:56,outline:"none",background:editable?"white":"#f8fafc"}}/></div>
                      {(()=>{const m=calcH(day.start,day.end,day.breakMins);return m!=null?<span style={{marginLeft:"auto",fontSize:"0.75rem",fontWeight:600,padding:"2px 8px",borderRadius:6,background:"#fee2e2",color:BRAND}}>{toHM(m)} / {toDec(m)}h</span>:null;})()}
                    </>)}
                  </>)}

                  {day.status!=="Worked"&&!dayIsWE&&<span style={{marginLeft:"auto",...sb2,fontSize:"0.75rem",fontWeight:500,padding:"2px 8px",borderRadius:6}}>{day.status}</span>}
                </div>
              </div>
            );
          })}
        </div>
      }
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App(){
  const[session,setSession]=useState(null);
  const[employees,setEmployees]=useState([]);
  const[newEmp,setNewEmp]=useState("");
  const[selectedEmp,setSelectedEmp]=useState(null);
  const[timesheets,setTimesheets]=useState({});
  const[expCache,setExpCache]=useState({});
  const[mcCache,setMcCache]=useState({});
  const[fortnightStart,setFortnightStart]=useState("");
  const[cycles,setCycles]=useState([]);
  const[cycleAnchor,setCycleAnchor]=useState("");
  const[showCycleSetup,setShowCycleSetup]=useState(false);
  const[view,setView]=useState("dashboard");
  const[delConfirm,setDelConfirm]=useState(null);
  const[showPw,setShowPw]=useState(false);
  const[showChangePw,setShowChangePw]=useState(false);
  const[showPrint,setShowPrint]=useState(false);
  const[showImport,setShowImport]=useState(false);
  const[expanded,setExpanded]=useState(null);
  const[loading,setLoading]=useState(true);

  const selectedCycle=cycles.find(c=>c.start_date===fortnightStart)||null;
  const isLocked=!!(selectedCycle&&selectedCycle.is_locked);

  const generateCyclesFromAnchor=async(anchor)=>{
    if(!anchor)return[];
    const today=todaySyd();
    const dayDiff=daysBetween(anchor,today);
    if(dayDiff<0){
      const{data:existing}=await sb.from("payroll_cycles").select("*").order("start_date",{ascending:false});
      const have=new Set((existing||[]).map(c=>c.start_date));
      if(!have.has(anchor)){
        await sb.from("payroll_cycles").insert({cycle_number:1,start_date:anchor,end_date:addDays(anchor,13),is_locked:false});
      }
    }else{
      const fortnightsNeeded=Math.floor(dayDiff/14)+2;
      const{data:existing}=await sb.from("payroll_cycles").select("*").order("start_date",{ascending:false});
      const have=new Set((existing||[]).map(c=>c.start_date));
      const toInsert=[];
      for(let i=0;i<fortnightsNeeded;i++){
        const sd=addDays(anchor,i*14);
        if(!have.has(sd)){
          toInsert.push({cycle_number:i+1,start_date:sd,end_date:addDays(sd,13),is_locked:false});
        }
      }
      if(toInsert.length>0){
        await sb.from("payroll_cycles").insert(toInsert);
      }
    }
    const{data:all}=await sb.from("payroll_cycles").select("*").order("start_date",{ascending:false});
    return all||[];
  };

  const pickDefaultCycle=(allCycles)=>{
    if(!allCycles||!allCycles.length)return"";
    const today=todaySyd();
    const current=allCycles.find(c=>c.start_date<=today&&c.end_date>=today);
    if(current)return current.start_date;
    return allCycles[0].start_date;
  };

  const loadData=async()=>{
    setLoading(true);
    try{
      const{data:emps}=await sb.from("employees").select("*").order("name");setEmployees(emps||[]);
      const{data:settings}=await sb.from("settings").select("key,value");
      const sp={};(settings||[]).forEach(s=>sp[s.key]=s.value);
      const anchor=sp["cycle_anchor"]||"";
      setCycleAnchor(anchor);
      let allCycles=[];
      if(anchor){
        allCycles=await generateCyclesFromAnchor(anchor);
        setCycles(allCycles);
        let sel=sp["fortnight_start"]||"";
        if(!allCycles.find(c=>c.start_date===sel)){
          sel=pickDefaultCycle(allCycles);
          if(sel)await sb.from("settings").upsert({key:"fortnight_start",value:sel});
        }
        setFortnightStart(sel);
        if(sel){
          const{data:ts}=await sb.from("timesheets").select("*").eq("fortnight_start",sel);
          const tsMap={};(ts||[]).forEach(t=>tsMap[t.employee_name]=safeSh(t.days));setTimesheets(tsMap);
          const{data:ex}=await sb.from("expenses").select("*").eq("fortnight_start",sel);
          const exMap={};(ex||[]).forEach(e=>exMap[e.employee_name]=e.data||[]);setExpCache(exMap);
          const{data:mc}=await sb.from("medical_certs").select("*").eq("fortnight_start",sel);
          const mcMap={};(mc||[]).forEach(m=>mcMap[m.employee_name]=m.data||[]);setMcCache(mcMap);
        }
      }else{
        const fs=sp["fortnight_start"]||"";
        setFortnightStart(fs);
        setCycles([]);
        if(fs){
          const{data:ts}=await sb.from("timesheets").select("*").eq("fortnight_start",fs);
          const tsMap={};(ts||[]).forEach(t=>tsMap[t.employee_name]=safeSh(t.days));setTimesheets(tsMap);
          const{data:ex}=await sb.from("expenses").select("*").eq("fortnight_start",fs);
          const exMap={};(ex||[]).forEach(e=>exMap[e.employee_name]=e.data||[]);setExpCache(exMap);
          const{data:mc}=await sb.from("medical_certs").select("*").eq("fortnight_start",fs);
          const mcMap={};(mc||[]).forEach(m=>mcMap[m.employee_name]=m.data||[]);setMcCache(mcMap);
        }
      }
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };

  useEffect(()=>{loadData();},[]);
  useEffect(()=>{if(session)setView("dashboard");},[session]);
  useEffect(()=>{if(session?.role==="educator")setSelectedEmp(session.empName);},[session]);

  useEffect(()=>{
    if(!loading&&session?.role==="admin"&&!cycleAnchor){
      const t=setTimeout(()=>setShowCycleSetup(true),300);
      return()=>clearTimeout(t);
    }
  },[loading,session,cycleAnchor]);

  const[unread,setUnread]=useState(0);
  useEffect(()=>{
    if(!session)return;
    const myName=session.role==="educator"?session.empName:session.role==="admin"?"Admin":"Director";
    const permTimer=setTimeout(()=>{requestNotificationPermission();},2000);
    const sub=sb.channel("app_msg_notifs")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{
        const m=payload.new;
        if(!m||m.sender===myName)return;
        playDing();
        setUnread(u=>u+1);
        if(document.hidden||!document.hasFocus()){
          const preview=(m.text||"").length>80?m.text.slice(0,80)+"…":(m.text||"");
          showDesktopNotification(m.sender+" — iRSK",preview);
        }
      })
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"maintenance"},payload=>{
        if(session.role!=="admin"&&session.role!=="director")return;
        const it=payload.new;
        if(!it||it.reported_by===myName)return;
        playDing();
        setUnread(u=>u+1);
        if(document.hidden||!document.hasFocus()){
          const preview=(it.description||"").length>80?it.description.slice(0,80)+"…":(it.description||"");
          showDesktopNotification("🔧 New maintenance — "+(it.reported_by||"Unknown"),preview);
        }
      })
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"maintenance"},payload=>{
        if(session.role!=="admin"&&session.role!=="director")return;
        const it=payload.new;const old=payload.old;
        if(!it)return;
        if(old&&old.status==="open"&&it.status==="done"){
          if(it.done_by===myName)return;
          playDing();
          setUnread(u=>u+1);
          if(document.hidden||!document.hasFocus()){
            const preview=(it.description||"").length>60?it.description.slice(0,60)+"…":(it.description||"");
            showDesktopNotification("✅ Maintenance done — "+(it.done_by||"Unknown"),preview);
          }
        }
      })
      .subscribe();
    const onFocus=()=>setUnread(0);
    const onVisible=()=>{if(!document.hidden)setUnread(0);};
    window.addEventListener("focus",onFocus);
    document.addEventListener("visibilitychange",onVisible);
    return()=>{
      clearTimeout(permTimer);
      sb.removeChannel(sub);
      window.removeEventListener("focus",onFocus);
      document.removeEventListener("visibilitychange",onVisible);
      setUnread(0);
    };
  },[session]);

  useEffect(()=>{
    document.title=unread>0?"("+unread+") iRSK":"iRSK";
  },[unread]);

  const addEmp=async()=>{const n=newEmp.trim();if(!n||employees.find(e=>e.name===n))return;await sb.from("employees").insert({name:n,role:"educator"});setNewEmp("");await loadData();};
  const delEmp=async n=>{await sb.from("employees").delete().eq("name",n);if(selectedEmp===n)setSelectedEmp(null);setDelConfirm(null);await loadData();};
  const getTS=emp=>timesheets[emp]||makeFN(fortnightStart);
  const updDay=async(emp,idx,field,val)=>{
    if(isLocked)return;
    const sheet=[...getTS(emp)];sheet[idx]={...sheet[idx],[field]:val};
    if(field==="status"&&val!=="Worked")sheet[idx]={...sheet[idx],start:"",end:"",breakMins:"",decimalHours:""};
    setTimesheets(t=>({...t,[emp]:sheet}));
    if(fortnightStart)await sb.from("timesheets").upsert({employee_name:emp,fortnight_start:fortnightStart,days:sheet,updated_at:new Date().toISOString()},{onConflict:"employee_name,fortnight_start"});
  };
  const selectCycle=async(startDate)=>{
    setFortnightStart(startDate);
    await sb.from("settings").upsert({key:"fortnight_start",value:startDate});
    const{data:ts}=await sb.from("timesheets").select("*").eq("fortnight_start",startDate);
    const tsMap={};(ts||[]).forEach(t=>tsMap[t.employee_name]=safeSh(t.days));setTimesheets(tsMap);
    const{data:ex}=await sb.from("expenses").select("*").eq("fortnight_start",startDate);
    const exMap={};(ex||[]).forEach(e=>exMap[e.employee_name]=e.data||[]);setExpCache(exMap);
    const{data:mc}=await sb.from("medical_certs").select("*").eq("fortnight_start",startDate);
    const mcMap={};(mc||[]).forEach(m=>mcMap[m.employee_name]=m.data||[]);setMcCache(mcMap);
  };
  const toggleLock=async(cycle)=>{
    const newLocked=!cycle.is_locked;
    await sb.from("payroll_cycles").update({
      is_locked:newLocked,
      locked_at:newLocked?new Date().toISOString():null,
      locked_by:newLocked?"Admin":null
    }).eq("id",cycle.id);
    const{data:all}=await sb.from("payroll_cycles").select("*").order("start_date",{ascending:false});
    setCycles(all||[]);
  };
  const copyFromPreviousCycle=async(cycle)=>{
    if(cycle.is_locked){alert("This cycle is locked. Unlock it first to copy a pattern into it.");return;}
    const prevStart=addDays(cycle.start_date,-14);
    const prev=cycles.find(c=>c.start_date===prevStart);
    if(!prev){alert("There's no previous cycle to copy from.");return;}
    const{data:prevSheets}=await sb.from("timesheets").select("employee_name,days").eq("fortnight_start",prev.start_date);
    if(!prevSheets||!prevSheets.length){alert("The previous cycle ("+fmtCycleName(prev.start_date)+") has no timesheet data to copy.");return;}
    const{data:existingSheets}=await sb.from("timesheets").select("employee_name").eq("fortnight_start",cycle.start_date);
    const existingNames=(existingSheets||[]).map(s=>s.employee_name);
    let msg="Copy the work pattern (statuses only — Worked / Day Off / Sick Leave / etc.) from "+fmtCycleName(prev.start_date)+" into "+fmtCycleName(cycle.start_date)+"?\n\nTimes, breaks and hours will NOT be copied — employees will fill those in.";
    if(existingNames.length>0){
      msg+="\n\n⚠️ "+existingNames.length+" employee(s) already have data in "+fmtCycleName(cycle.start_date)+" — their entries will be OVERWRITTEN.";
    }
    if(!confirm(msg))return;
    const newRows=prevSheets.map(prevRow=>{
      const prevDays=safeSh(prevRow.days);
      const newDays=Array.from({length:14},(_,i)=>{
        const we=isWE(i,cycle.start_date);
        if(we)return{...defDay(true),dayIndex:i};
        const prevStatus=prevDays[i]?.status||"Worked";
        const status=prevStatus==="Weekend"?"Worked":prevStatus;
        return{status,start:"",end:"",breakMins:"",decimalHours:"",dayIndex:i};
      });
      return{employee_name:prevRow.employee_name,fortnight_start:cycle.start_date,days:newDays,updated_at:new Date().toISOString()};
    });
    await sb.from("timesheets").upsert(newRows,{onConflict:"employee_name,fortnight_start"});
    if(cycle.start_date===fortnightStart){
      const tsMap={};newRows.forEach(r=>tsMap[r.employee_name]=r.days);setTimesheets(t=>({...t,...tsMap}));
    }
    alert("✅ Copied pattern from "+fmtCycleName(prev.start_date)+" → "+fmtCycleName(cycle.start_date)+" for "+newRows.length+" employee(s).");
  };
  const saveAnchor=async(anchor)=>{
    await sb.from("settings").upsert({key:"cycle_anchor",value:anchor});
    setCycleAnchor(anchor);
    const all=await generateCyclesFromAnchor(anchor);
    setCycles(all);
    const sel=pickDefaultCycle(all);

            {view==="summary"&&(
              <div style={{display:"flex",flexDirection:"column",gap:16}}>
                {employees.length===0?<div style={{background:"white",borderRadius:"1rem",padding:"3rem",textAlign:"center",color:"#94a3b8"}}>No employees added yet</div>:<>
                  {(()=>{let gt=0,ts=0,ta=0,tp=0,tw=0;employees.forEach(emp=>{const{td,sk,al,ph}=summ(emp.name);gt+=td;ts+=sk;ta+=al;tp+=ph;getTS(emp.name).forEach(d=>{if(d.status==="Worked")tw++;});});
                  return(<div style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)",borderLeft:"4px solid "+BRAND}}>
                    <div style={{fontWeight:700,fontSize:"1rem",color:"#1e293b",marginBottom:4}}>📊 Fortnight Summary — All Staff{selectedCycle?<span style={{fontSize:"0.75rem",fontWeight:500,color:"#64748b",marginLeft:8}}>{fmtCycleName(selectedCycle.start_date)}{isLocked?" 🔒":""}</span>:null}</div>
                    {fortnightStart&&<div style={{fontSize:"0.75rem",color:"#64748b",marginBottom:12}}>{fmtShort(fortnightStart)} – {fmtShort(fortnightStart,13)} · {employees.length} employee{employees.length!==1?"s":""}</div>}
                    <div className="app-stats-3" style={{marginBottom:8}}>{[{v:gt.toFixed(2),l:"Total Hours",s:"all staff",bg:"#fee2e2",c:BRAND},{v:(gt/Math.max(employees.length,1)).toFixed(2),l:"Avg Hours",s:"per employee",bg:"#fef3c7",c:"#d97706"},{v:tw,l:"Days Worked",s:"across all",bg:"#eff6ff",c:"#3b82f6"}].map(({v,l,s,bg,c})=><div key={l} style={{background:bg,borderRadius:"0.75rem",padding:"0.75rem",textAlign:"center"}}><div style={{fontSize:"1.4rem",fontWeight:800,color:c}}>{v}</div><div style={{fontSize:"0.75rem",fontWeight:600,color:c}}>{l}</div><div style={{fontSize:"0.65rem",color:c,opacity:0.7}}>{s}</div></div>)}</div>
                    <div className="app-stats-3">{[{v:tp,l:"Public Holidays",bg:"#fef9c3",c:"#b45309"},{v:ta,l:"Annual Leave",bg:"#f0fdf4",c:"#16a34a"},{v:ts,l:"Sick Leave",bg:"#fff1f2",c:"#e11d48"}].map(({v,l,bg,c})=><div key={l} style={{background:bg,borderRadius:"0.75rem",padding:"0.75rem",textAlign:"center"}}><div style={{fontSize:"1.4rem",fontWeight:800,color:c}}>{v}</div><div style={{fontSize:"0.75rem",fontWeight:600,color:c}}>{l}</div></div>)}</div>
                  </div>);})()}
                  {employees.map(emp=>{const{td,sk,al,ph}=summ(emp.name);const sheet=getTS(emp.name);
                    const w1=sheet.slice(0,5).reduce((s,d)=>{if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return s+m/60;}if(d.decimalHours&&d.status==="Worked")return s+parseFloat(d.decimalHours);return s;},0);
                    const w2=sheet.slice(7,12).reduce((s,d)=>{if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)return s+m/60;}if(d.decimalHours&&d.status==="Worked")return s+parseFloat(d.decimalHours);return s;},0);
                    return(<div key={emp.name} style={{background:"white",borderRadius:"1rem",padding:16,boxShadow:"0 2px 8px rgba(0,0,0,0.07)",border:"2px solid "+(emp.name===selectedEmp?BRAND:"transparent")}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                        <div style={{fontWeight:600,fontSize:"1rem",color:"#1e293b"}}>{emp.name}</div>
                        <div style={{display:"flex",gap:6,fontSize:"0.7rem"}}><span style={{background:"#f1f5f9",color:"#64748b",padding:"2px 8px",borderRadius:999}}>Wk1: {w1.toFixed(2)}h</span><span style={{background:"#f1f5f9",color:"#64748b",padding:"2px 8px",borderRadius:999}}>Wk2: {w2.toFixed(2)}h</span></div>
                      </div>
                      <div className="app-stats-4" style={{marginBottom:12,gap:8}}>{[{v:td.toFixed(2),l:"Total hrs",bg:"#fee2e2",c:BRAND},{v:ph,l:"Public holidays",bg:"#fef9c3",c:"#b45309"},{v:sk,l:"Sick days",bg:"#fff1f2",c:"#e11d48"},{v:al,l:"Annual leave",bg:"#f0fdf4",c:"#16a34a"}].map(({v,l,bg,c})=><div key={l} style={{background:bg,borderRadius:"0.6rem",padding:"0.5rem",textAlign:"center"}}><div style={{fontSize:"1.1rem",fontWeight:700,color:c}}>{v}</div><div style={{fontSize:"0.65rem",color:c,marginTop:1}}>{l}</div></div>)}</div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{sheet.map((d,i)=>{let val=null;if(d.status==="Worked"){if(d.start&&d.end){const m=calcH(d.start,d.end,d.breakMins);if(m!=null)val=toDec(m);}else if(d.decimalHours&&parseFloat(d.decimalHours)>0)val=parseFloat(d.decimalHours).toFixed(2);}const bg=d.status==="Sick Leave"?"#fee2e2":d.status==="Annual Leave"?"#dcfce7":d.status==="Public Holiday"?"#fef9c3":d.status==="Day Off"||d.status==="Weekend"?"#e2e8f0":val?BRAND:"#f1f5f9";const color=d.status==="Sick Leave"?"#e11d48":d.status==="Annual Leave"?"#16a34a":d.status==="Public Holiday"?"#b45309":d.status==="Day Off"||d.status==="Weekend"?"#94a3b8":val?"white":"#94a3b8";const lbl=d.status==="Sick Leave"?"SL":d.status==="Annual Leave"?"AL":d.status==="Public Holiday"?"PH":d.status==="Day Off"?"—":d.status==="Weekend"?"WE":val||"?";return<div key={i} title={fmtDay(i,fortnightStart)} style={{borderRadius:4,padding:"3px 7px",fontSize:"0.7rem",textAlign:"center",minWidth:36,background:bg,color}}>{lbl}</div>;})}</div>
                    </div>);
                  })}
                </>}
              </div>
            )}
          </div>
        </div>
      </>)}
    </div>
  );
}

ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
