// ── Sydney Time ───────────────────────────────────────────────
const SYD="Australia/Sydney";
const nowSyd=()=>new Date(new Date().toLocaleString("en-US",{timeZone:SYD}));
const todaySyd=()=>{const d=nowSyd();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const timeSyd=()=>nowSyd().toLocaleTimeString("en-AU",{hour:"2-digit",minute:"2-digit",hour12:true});
const fmtDate=(fs,off=0)=>{if(!fs)return"—";const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+off);return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"long",year:"numeric"});};
const fmtShort=(fs,off=0)=>{if(!fs)return"—";const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+off);return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"});};
const fmtDay=(i,fs)=>{if(!fs)return"Day "+(i+1);const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+i);return d.toLocaleDateString("en-AU",{timeZone:SYD,weekday:"short",day:"numeric",month:"short"});};
const fmtDayLong=(i,fs)=>{if(!fs)return"Day "+(i+1);const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+i);return d.toLocaleDateString("en-AU",{timeZone:SYD,weekday:"long",day:"numeric",month:"long"});};
const fmtGen=()=>nowSyd().toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"});

// ── Helpers ───────────────────────────────────────────────────
const roundBrk=m=>Math.ceil((parseInt(m)||0)/5)*5;
const toHM=m=>Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m";
const toDec=m=>(m/60).toFixed(2);
const decToHM=d=>{const t=parseFloat(d);if(isNaN(t))return"—";const h=Math.floor(t);const m=Math.round((t-h)*60);return h+"h "+String(m).padStart(2,"0")+"m";};
const toKey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const f2b=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
const defDay=(we=false)=>({status:we?"Weekend":"Worked",start:"",end:"",breakMins:"",decimalHours:""});
const isWE=(i,fs)=>{if(!fs)return false;const d=new Date(fs+"T12:00:00");d.setDate(d.getDate()+i);return d.getDay()===0||d.getDay()===6;};
const makeFN=(fs="")=>Array.from({length:14},(_,i)=>({...defDay(isWE(i,fs)),dayIndex:i}));
const safeSh=days=>Array.isArray(days)&&days.length===14?days:makeFN();
const calcH=(s,e,b)=>{if(!s||!e)return null;const[sh,sm]=s.split(":").map(Number);const[eh,em]=e.split(":").map(Number);const m=(eh*60+em)-(sh*60+sm)-roundBrk(b);return m<0?null:m;};
const sCol=s=>({"Worked":"#eff6ff;#bfdbfe","Sick Leave":"#fff1f2;#fecdd3","Annual Leave":"#f0fdf4;#bbf7d0","Day Off":"#f9fafb;#e5e7eb","Public Holiday":"#fefce8;#fef08a","Weekend":"#f1f5f9;#cbd5e1"}[s]||"#f9fafb;#e5e7eb").split(";");
const sBadge=s=>({"Worked":{background:"#dbeafe",color:"#1d4ed8"},"Sick Leave":{background:"#fee2e2",color:"#dc2626"},"Annual Leave":{background:"#dcfce7",color:"#16a34a"},"Day Off":{background:"#f3f4f6",color:"#9ca3af"},"Public Holiday":{background:"#fef9c3",color:"#b45309"},"Weekend":{background:"#e2e8f0",color:"#64748b"}}[s]||{background:"#f3f4f6",color:"#9ca3af"});

// ── Payroll Cycle Helpers ─────────────────────────────────────
const addDays=(dateStr,days)=>{const d=new Date(dateStr+"T12:00:00");d.setDate(d.getDate()+days);return toKey(d);};
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
const fmtCycleRange=fs=>{if(!fs)return"";const d1=new Date(fs+"T12:00:00");const d2=new Date(fs+"T12:00:00");d2.setDate(d2.getDate()+13);const a=d1.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short"});const b=d2.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"});return a+" → "+b;};
const fmtCycleName=fs=>{if(!fs)return"Timesheet";const d=new Date(fs+"T12:00:00");return"Timesheet"+String(d.getDate()).padStart(2,"0")+String(d.getMonth()+1).padStart(2,"0")+String(d.getFullYear()).slice(-2);};

// ── Notifications ─────────────────────────────────────────────
// Soft "ding" via Web Audio (no audio file needed)
let _audioCtx=null;
function playDing(){
  try{
    if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const ctx=_audioCtx;
    if(ctx.state==="suspended")ctx.resume();
    const t=ctx.currentTime;
    // Two-tone soft chime: E5 then G5
    [{f:659.25,start:0},{f:783.99,start:0.12}].forEach(({f,start})=>{
      const osc=ctx.createOscillator();const gain=ctx.createGain();
      osc.type="sine";osc.frequency.value=f;
      gain.gain.setValueAtTime(0,t+start);
      gain.gain.linearRampToValueAtTime(0.15,t+start+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,t+start+0.4);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.start(t+start);osc.stop(t+start+0.45);
    });
  }catch(e){/* audio blocked or unsupported — silent fail */}
}

// Desktop notification — call only when document is hidden
function showDesktopNotification(title,body){
  try{
    if(!("Notification" in window))return;
    if(Notification.permission!=="granted")return;
    const n=new Notification(title,{body,tag:"irsk-msg",renotify:true,silent:false});
    n.onclick=()=>{window.focus();n.close();};
    setTimeout(()=>n.close(),6000);
  }catch(e){/* ignore */}
}

function requestNotificationPermission(){
  if(!("Notification" in window))return Promise.resolve("unsupported");
  if(Notification.permission==="granted"||Notification.permission==="denied")return Promise.resolve(Notification.permission);
  return Notification.requestPermission();
}

// ── CSV/XLSX Parser ───────────────────────────────────────────
const parseTm=t=>{if(!t)return"";t=String(t).trim();const ap=t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(ap){let h=parseInt(ap[1]);const p=ap[3].toUpperCase();if(p==="PM"&&h!==12)h+=12;if(p==="AM"&&h===12)h=0;return String(h).padStart(2,"0")+":"+ap[2];}const pl=t.match(/(\d+):(\d+)/);if(pl)return String(parseInt(pl[1])).padStart(2,"0")+":"+pl[2];return"";};
const parseDt=d=>{if(!d)return null;const p=String(d).trim().split("/");if(p.length===3)return new Date(parseInt(p[2]),parseInt(p[1])-1,parseInt(p[0]));return null;};
const descSt=desc=>{const d=String(desc||"").trim().toLowerCase();if(d.includes("sick"))return"Sick Leave";if(d.includes("annual")||d.includes("leave"))return"Annual Leave";if(d.includes("public")||d.includes("holiday")||d==="ph")return"Public Holiday";if(d===""||d==="off"||d==="day off")return"Day Off";return"Worked";};
function parseFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const isCSV=file.name.toLowerCase().endsWith(".csv");
        let rows;
        if(isCSV){const text=new TextDecoder("utf-8").decode(new Uint8Array(e.target.result));rows=text.split(/\r?\n/).map(l=>l.split(",").map(c=>c.trim().replace(/^"|"$/g,"")));}
        else{const wb=XLSX.read(e.target.result,{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""}).map(r=>r.map(c=>String(c||"").trim()));}
        const result={};let cur=null;
        const DAYS=["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
        for(let i=0;i<rows.length;i++){
          const row=rows[i].map(c=>String(c||"").trim());
          const ne=row.filter(c=>c!=="");if(!ne.length)continue;
          const j=row.join(",").toLowerCase();
          if(j.includes("total hours")||j.includes("week begin")||j.includes("arrival time")||j.includes("actual start")||row[0].toLowerCase()==="staff")continue;
          const di=row.findIndex(c=>/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(c));
          if(di>=0){
            if(!cur)continue;
            const dateObj=parseDt(row[di]);if(!dateObj)continue;
            const st=parseTm(row[6]);const en=parseTm(row[9]);
            const lunch=roundBrk(parseInt(row[7])||0);
            let status=descSt(row[4]||"");
            let dec=0;
            if(st&&en){const[sh,sm]=st.split(":").map(Number);const[eh,em]=en.split(":").map(Number);const net=(eh*60+em)-(sh*60+sm)-lunch;if(net>0)dec=net/60;}
            if(status==="Worked"&&dec<=0)status="Day Off";
            result[cur][toKey(dateObj)]={status,start:status==="Worked"?st:"",end:status==="Worked"?en:"",breakMins:status==="Worked"?String(lunch):"",decimalHours:status==="Worked"?dec.toFixed(2):""};
          }else{
            const isDay=DAYS.some(d=>row[0].toLowerCase().startsWith(d));
            if(ne.length===1&&row[0]&&!isDay&&!/^\d/.test(row[0])){cur=row[0];if(!result[cur])result[cur]={};}
          }
        }
        if(!Object.keys(result).length)throw new Error("No staff found in file.");
        let allDates=[];Object.values(result).forEach(emp=>allDates.push(...Object.keys(emp)));allDates.sort();
        const[fy,fm,fd]=allDates[0].split("-").map(Number);
        const mon=new Date(fy,fm-1,fd,12,0,0);const dow=mon.getDay();mon.setDate(mon.getDate()-(dow===0?6:dow===1?0:dow-1));
        const final={};
        Object.entries(result).forEach(([emp,dm])=>{
          final[emp]=Array.from({length:14},(_,idx)=>{
            const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+idx);
            if(d.getDay()===0||d.getDay()===6)return{...defDay(true)};
            const key=toKey(d);
            return dm[key]?{...defDay(false),...dm[key]}:{...defDay(false),status:"Day Off"};
          });
        });
        resolve({data:final,fortnightStart:toKey(mon)});
      }catch(err){reject(err);}
    };
    reader.onerror=reject;reader.readAsArrayBuffer(file);
  });
}

function Modal({title,onClose,children,footer,maxWidth=440}){

          <span style={{fontWeight:700,fontSize:"1.1rem"}}>{title}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:"1.4rem",cursor:"pointer",color:"#94a3b8"}}>✕</button>

// ── PIN Pad Component ─────────────────────────────────────────
function PinPad({value,onChange,maxLength=6}){
  const tap=n=>{if(value.length<maxLength)onChange(value+n);};
  const del=()=>onChange(value.slice(0,-1));
  const clear=()=>onChange("");
  const dots=Array.from({length:maxLength},(_,i)=>i<value.length);
  const keyStyle={width:"100%",aspectRatio:"1.4",borderRadius:"0.75rem",fontSize:"1.5rem",fontWeight:600,border:"1px solid #e2e8f0",background:"white",color:"#1e293b",cursor:"pointer",userSelect:"none"};
  return(
    <div>
      <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:16}}>
        {dots.map((filled,i)=><div key={i} style={{width:14,height:14,borderRadius:"50%",background:filled?BRAND:"#e2e8f0",transition:"background 0.15s"}}/>)}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
        {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} onClick={()=>tap(String(n))} style={keyStyle}>{n}</button>)}
        <button onClick={clear} style={{...keyStyle,fontSize:"0.75rem",color:"#94a3b8",fontWeight:500}}>Clear</button>
        <button onClick={()=>tap("0")} style={keyStyle}>0</button>
        <button onClick={del} style={{...keyStyle,fontSize:"1.25rem",color:"#94a3b8"}}>⌫</button>
      </div>
    </div>
  );
}

// ── Login ─────────────────────────────────────────────────────
function LoginScreen({onLogin}){
  const[mode,setMode]=useState("pin");
  const[pw,setPw]=useState("");const[pin,setPin]=useState("");
  const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const[checked4,setChecked4]=useState(false);

  const goPw=async()=>{
    setLoading(true);setErr("");
    try{
      const{data:settings}=await sb.from("settings").select("key,value");
      const sp={};(settings||[]).forEach(s=>sp[s.key]=s.value);
      if(pw.trim()===(sp["pw_admin"]||"admin123")){onLogin("admin",null);return;}
      setErr("Incorrect password. Please try again.");
    }catch(e){setErr("Connection error. Check your internet.");}
    finally{setLoading(false);}
  };

  const tryEducator=async p=>{
    setLoading(true);setErr("");
    try{
      const{data:emps}=await sb.from("employees").select("name,password");
      for(const emp of(emps||[])){
        if(emp.password&&p===emp.password.trim()){onLogin("educator",emp.name);return true;}
      }
      return false;
    }catch(e){setErr("Connection error. Check your internet.");return false;}
    finally{setLoading(false);}
  };

  const tryDirector=async p=>{
    setLoading(true);setErr("");
    try{
      const{data:settings}=await sb.from("settings").select("key,value");
      const sp={};(settings||[]).forEach(s=>sp[s.key]=s.value);
      if(p===(sp["pw_director"]||"123456")){onLogin("director",null);return true;}
      return false;
    }catch(e){setErr("Connection error. Check your internet.");return false;}
    finally{setLoading(false);}
  };

  useEffect(()=>{if(pin.length<EDUCATOR_PIN_LEN&&checked4)setChecked4(false);if(err&&pin.length===0)setErr("");},[pin,checked4,err]);

  useEffect(()=>{
    if(mode!=="pin")return;
    if(pin.length===EDUCATOR_PIN_LEN&&!checked4){
      (async()=>{
        const ok=await tryEducator(pin);
        if(!ok)setChecked4(true);
      })();

// ── Password / PIN Manager ────────────────────────────────────
function PwManager({employees,role,onClose}){
  const isAdmin=role==="admin";
  const[ap,setAp]=useState("");const[dp,setDp]=useState("");const[eps,setEps]=useState({});const[saved,setSaved]=useState("");const[err,setErr]=useState("");
  const[confirmReset,setConfirmReset]=useState(false);const[resetDone,setResetDone]=useState(false);
  const load=async()=>{const{data}=await sb.from("settings").select("key,value");const sp={};(data||[]).forEach(s=>sp[s.key]=s.value);setAp(sp["pw_admin"]||"admin123");setDp(sp["pw_director"]||"123456");const p={};employees.forEach(emp=>{p[emp.name]=emp.password||"";});setEps(p);};
  useEffect(()=>{load();},[]);
  const onlyDigits=(v,max)=>v.replace(/\D/g,"").slice(0,max);
  const save=async()=>{
    setErr("");
    for(const emp of employees){const v=eps[emp.name]||"";if(v&&v.length!==EDUCATOR_PIN_LEN){setErr(emp.name+"'s PIN must be exactly "+EDUCATOR_PIN_LEN+" digits.");return;}}
    if(isAdmin){
      if(dp&&dp.length!==DIRECTOR_PIN_LEN){setErr("Director PIN must be exactly "+DIRECTOR_PIN_LEN+" digits.");return;}
      await sb.from("settings").upsert([{key:"pw_admin",value:ap},{key:"pw_director",value:dp}]);
    }
    for(const emp of employees){await sb.from("employees").update({password:eps[emp.name]||""}).eq("name",emp.name);}
    setSaved("Saved!");setTimeout(()=>setSaved(""),2000);
  };
  const doReset=async()=>{
    await sb.from("settings").upsert([{key:"pw_admin",value:"admin123"},{key:"pw_director",value:"123456"}]);
    for(const emp of employees){await sb.from("employees").update({password:""}).eq("name",emp.name);}
    setConfirmReset(false);setResetDone(true);await load();setTimeout(()=>setResetDone(false),4000);
  };
  const inp={width:"100%",border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.4rem 0.75rem",fontSize:"0.875rem",outline:"none",boxSizing:"border-box"};
  const pinInp={...inp,fontFamily:"monospace",letterSpacing:"0.2em",fontSize:"1rem"};
  return(
    <Modal title={isAdmin?"🔐 Manage Passwords & PINs":"🔢 Manage Educator PINs"} onClose={onClose}>
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {isAdmin&&<>
          <div><label style={{fontSize:"0.7rem",fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:4}}>🔑 Admin Password</label><input type="text" value={ap} onChange={e=>setAp(e.target.value)} style={inp}/></div>
          <div><label style={{fontSize:"0.7rem",fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:4}}>🔢 Director PIN ({DIRECTOR_PIN_LEN} digits)</label><input type="text" inputMode="numeric" maxLength={DIRECTOR_PIN_LEN} value={dp} onChange={e=>setDp(onlyDigits(e.target.value,DIRECTOR_PIN_LEN))} placeholder={"0".repeat(DIRECTOR_PIN_LEN)} style={pinInp}/></div>
        </>}
        {!isAdmin&&<div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:"0.5rem",padding:"0.6rem 0.8rem",fontSize:"0.75rem",color:"#1d4ed8"}}>Set or update {EDUCATOR_PIN_LEN}-digit PINs for educators. To change your own Director PIN, use the <strong>🔢 My PIN</strong> button.</div>}
        {employees.length>0?<div><label style={{fontSize:"0.7rem",fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:8}}>🔢 Educator PINs ({EDUCATOR_PIN_LEN} digits each)</label>{employees.map(emp=><div key={emp.name} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:"0.875rem",color:"#334155",width:"8rem",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{emp.name}</span><input type="text" inputMode="numeric" maxLength={EDUCATOR_PIN_LEN} placeholder={"0".repeat(EDUCATOR_PIN_LEN)} value={eps[emp.name]||""} onChange={e=>setEps(p=>({...p,[emp.name]:onlyDigits(e.target.value,EDUCATOR_PIN_LEN)}))} style={{...pinInp,flex:1}}/></div>)}</div>:<p style={{fontSize:"0.75rem",color:"#94a3b8",textAlign:"center",padding:"0.5rem 0"}}>No educators yet</p>}
        {err&&<p style={{color:"#ef4444",fontSize:"0.875rem"}}>{err}</p>}
        {saved&&<p style={{color:"#16a34a",fontSize:"0.875rem"}}>{saved}</p>}
        {resetDone&&<p style={{color:"#16a34a",fontSize:"0.8rem",background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:"0.5rem",padding:"0.5rem 0.75rem"}}>✅ Reset complete! Admin: <strong>admin123</strong> · Director PIN: <strong>123456</strong> · All Educator PINs cleared.</p>}
        <button onClick={save} style={{padding:"0.5rem",borderRadius:"0.5rem",background:BRAND,color:"white",fontWeight:600,fontSize:"0.875rem",border:"none",cursor:"pointer"}}>Save All</button>
        {isAdmin&&<div style={{borderTop:"1px solid #e2e8f0",paddingTop:12,marginTop:4}}>
          {confirmReset
            ?<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:"0.5rem",padding:"0.75rem"}}>
              <p style={{fontSize:"0.8rem",color:"#991b1b",marginBottom:8,fontWeight:600}}>⚠️ Reset everything to defaults?</p>
              <p style={{fontSize:"0.7rem",color:"#7f1d1d",marginBottom:10}}>Admin password → admin123<br/>Director PIN → 123456<br/>All Educator PINs will be <strong>cleared</strong> (they won't be able to log in until you set new {EDUCATOR_PIN_LEN}-digit PINs).</p>
              <div style={{display:"flex",gap:8}}>
                <button onClick={doReset} style={{flex:1,fontSize:"0.75rem",background:"#ef4444",color:"white",border:"none",borderRadius:6,padding:"6px 12px",cursor:"pointer",fontWeight:600}}>Yes, Reset All</button>
                <button onClick={()=>setConfirmReset(false)} style={{flex:1,fontSize:"0.75rem",background:"#e2e8f0",color:"#475569",border:"none",borderRadius:6,padding:"6px 12px",cursor:"pointer"}}>Cancel</button>
              </div>
            </div>
            :<button onClick={()=>setConfirmReset(true)} style={{width:"100%",fontSize:"0.75rem",color:"#94a3b8",background:"none",border:"1px dashed #e2e8f0",borderRadius:"0.5rem",padding:"0.5rem",cursor:"pointer"}}>🔄 Reset All to Defaults</button>}
        </div>}
      </div>
    </Modal>
  );
}

// ── Change My PIN ─────────────────────────────────────────────
function ChangeMyPw({session,onClose}){
  const isEducator=session.role==="educator";
  const PIN_LEN=isEducator?EDUCATOR_PIN_LEN:DIRECTOR_PIN_LEN;
  const[step,setStep]=useState("current");
  const[cur,setCur]=useState("");const[nw,setNw]=useState("");const[con,setCon]=useState("");
  const[err,setErr]=useState("");const[done,setDone]=useState(false);
  const verifyCurrent=async()=>{
    setErr("");
    if(isEducator){
      const{data}=await sb.from("employees").select("password").eq("name",session.empName).single();
      if(!data||cur!==(data.password||"").trim()){setErr("Current PIN is incorrect.");setCur("");return;}
    }else{
      const{data}=await sb.from("settings").select("value").eq("key","pw_director").single();
      if(!data||cur!==(data.value||"").trim()){setErr("Current PIN is incorrect.");setCur("");return;}
    }
    setStep("new");
  };
  const saveNew=async()=>{
    setErr("");
    if(nw!==con){setErr("New PINs don't match.");setCon("");return;}
    if(isEducator){await sb.from("employees").update({password:nw}).eq("name",session.empName);}
    else{await sb.from("settings").upsert({key:"pw_director",value:nw});}
    setDone(true);setTimeout(()=>onClose(),1500);
  };
  useEffect(()=>{if(step==="current"&&cur.length===PIN_LEN)verifyCurrent();},[cur,step]);
  useEffect(()=>{if(step==="new"&&nw.length===PIN_LEN)setStep("confirm");},[nw,step]);
  useEffect(()=>{if(step==="confirm"&&con.length===PIN_LEN)saveNew();},[con,step]);
  const title=step==="current"?"Enter Current PIN":step==="new"?"Enter New PIN ("+PIN_LEN+" digits)":"Confirm New PIN";
  const val=step==="current"?cur:step==="new"?nw:con;
  const setVal=step==="current"?setCur:step==="new"?setNw:setCon;
  return(
    <Modal title="🔢 Change My PIN" onClose={onClose} maxWidth={340}>
      <div>
        <p style={{textAlign:"center",fontSize:"0.85rem",color:"#475569",marginBottom:14,fontWeight:600}}>{title}</p>
        <PinPad value={val} onChange={setVal} maxLength={PIN_LEN}/>
        {err&&<p style={{color:"#ef4444",fontSize:"0.75rem",textAlign:"center",marginTop:10}}>{err}</p>}
        {done&&<p style={{color:"#16a34a",fontSize:"0.85rem",textAlign:"center",marginTop:10,fontWeight:600}}>✅ PIN changed!</p>}
        {step!=="current"&&!done&&<button onClick={()=>{setStep("current");setCur("");setNw("");setCon("");setErr("");}} style={{width:"100%",marginTop:10,padding:"0.4rem",borderRadius:"0.5rem",background:"#f1f5f9",color:"#64748b",border:"none",cursor:"pointer",fontSize:"0.75rem"}}>← Start over</button>}
      </div>
    </Modal>
  );
}

  const[certs,setCerts]=useState([]);const[prev,setPrev]=useState(null);const ref=useRef();
  useEffect(()=>{(async()=>{if(!empName||!fortnightStart)return;const{data}=await sb.from("medical_certs").select("data").eq("employee_name",empName).eq("fortnight_start",fortnightStart).single();setCerts(data?.data||[]);})();},[empName,fortnightStart]);
  const saveMC=async list=>{setCerts(list);await sb.from("medical_certs").upsert({employee_name:empName,fortnight_start:fortnightStart,data:list,updated_at:new Date().toISOString()},{onConflict:"employee_name,fortnight_start"});};
  const onFile=async e=>{const fs=Array.from(e.target.files);if(!fs.length)return;const nc=await Promise.all(fs.map(async f=>{const b=await f2b(f);return{id:Date.now()+Math.random(),name:f.name,type:f.type.startsWith("image/")?"image":"file",data:b,date:nowSyd().toLocaleDateString("en-AU",{timeZone:SYD})};}));saveMC([...certs,...nc]);if(ref.current)ref.current.value="";};
  return(
    <div style={{marginTop:8}}>
      {canEdit&&<label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",background:"#f8fafc",border:"1px dashed #cbd5e1",borderRadius:"0.75rem",padding:"0.75rem 1rem",marginBottom:"0.75rem",width:"100%",boxSizing:"border-box"}}><span style={{fontSize:"1.25rem"}}>📎</span><div><div style={{fontWeight:500,color:"#475569",fontSize:"0.875rem"}}>Upload Certificate</div><div style={{fontSize:"0.75rem",color:"#94a3b8"}}>Image or PDF</div></div><input type="file" accept="image/*,.pdf" multiple ref={ref} onChange={onFile} style={{display:"none"}}/></label>}
      {!certs.length?<p style={{color:"#94a3b8",fontSize:"0.75rem",textAlign:"center",padding:"0.5rem 0"}}>No certificates</p>:
        <div>{certs.map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:10,background:"white",border:"1px solid #f1f5f9",borderRadius:"0.75rem",padding:"0.625rem",marginBottom:6}}>{c.type==="image"?<img src={c.data} onClick={()=>setPrev(c.data)} style={{width:48,height:48,objectFit:"cover",borderRadius:6,border:"1px solid #e2e8f0",cursor:"pointer",flexShrink:0}}/>:<div style={{width:48,height:48,background:"#f1f5f9",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:"1.5rem"}}>📄</div>}<div style={{flex:1,minWidth:0}}><div style={{fontSize:"0.875rem",fontWeight:500,color:"#334155",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</div><div style={{fontSize:"0.75rem",color:"#94a3b8"}}>Uploaded {c.date}</div></div>{canEdit&&<button onClick={()=>saveMC(certs.filter(x=>x.id!==c.id))} style={{background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:"0.75rem"}}>✕</button>}</div>)}</div>
      }
      {prev&&<div onClick={()=>setPrev(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}><div style={{position:"relative",maxWidth:600,width:"100%"}}><img src={prev} style={{width:"100%",borderRadius:12}}/><button onClick={()=>setPrev(null)} style={{position:"absolute",top:8,right:8,background:"white",border:"none",borderRadius:"50%",width:32,height:32,fontWeight:700,cursor:"pointer"}}>✕</button></div></div>}
    </div>
  );
}

// ── Notice Board ──────────────────────────────────────────────
function NoticeBoard({session}){
  const[posts,setPosts]=useState([]);const[txt,setTxt]=useState("");const[file,setFile]=useState(null);const[fName,setFName]=useState("");const[posting,setPosting]=useState(false);
  const ref=useRef();
  const load=async()=>{const{data}=await sb.from("notices").select("*").order("created_at",{ascending:false});setPosts(data||[]);};
  useEffect(()=>{load();const sub=sb.channel("notices_ch").on("postgres_changes",{event:"*",schema:"public",table:"notices"},()=>load()).subscribe();return()=>sb.removeChannel(sub);},[]);
  const onFile=async e=>{const f=e.target.files[0];if(!f)return;setFName(f.name);const b=await f2b(f);setFile({name:f.name,data:b,type:f.type.startsWith("image/")?"image":"file"});};
  const post=async()=>{
    if(!txt.trim()&&!file)return;setPosting(true);
    const{error}=await sb.from("notices").insert({sender:session.role==="admin"?"Admin":"Director",role:session.role,text:txt.trim()||null,file:file||null});
    if(error){alert("Error posting notice: "+error.message);setPosting(false);return;}
    setTxt("");setFile(null);setFName("");if(ref.current)ref.current.value="";setPosting(false);await load();
  };
  const del=async id=>{await sb.from("notices").delete().eq("id",id);setPosts(p=>p.filter(x=>x.id!==id));};
  const rb=role=>({admin:{bg:"#fee2e2",c:"#e8192c"},director:{bg:"#dbeafe",c:"#1d4ed8"}}[role]||{bg:"#f1f5f9",c:"#475569"});
  const canPost=session.role==="admin"||session.role==="director";
  const canDel=p=>session.role==="admin"||(session.role==="director"&&p.sender==="Director");
  return(
    <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{padding:"0.875rem 1rem",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:"1rem",color:"#1e293b",flexShrink:0,borderTop:"3px solid "+BRAND,borderRadius:"1rem 1rem 0 0"}}>
        📋 Notice Board <span style={{fontSize:"0.7rem",fontWeight:400,color:"#94a3b8"}}>{canPost?"Post for your team":"Read only"}</span>
      </div>
      {canPost&&<div style={{padding:"0.75rem 1rem",borderBottom:"1px solid #e2e8f0",flexShrink:0}}>
        <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Write an announcement..." rows={3}
          style={{width:"100%",border:"1px solid #e2e8f0",borderRadius:"0.75rem",padding:"0.625rem 0.875rem",fontSize:"0.875rem",outline:"none",resize:"none",lineHeight:1.5,boxSizing:"border-box",marginBottom:8}}/>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:"0.75rem",color:"#64748b",background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.375rem 0.75rem"}}>📎 {fName||"Attach image or file"}<input type="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" ref={ref} onChange={onFile} style={{display:"none"}}/></label>
          {fName&&<span style={{fontSize:"0.75rem",color:"#16a34a",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>✓ {fName}</span>}
          <button onClick={post} disabled={posting||(!txt.trim()&&!file)} style={{marginLeft:"auto",padding:"0.375rem 1rem",borderRadius:"0.5rem",background:BRAND,color:"white",fontWeight:600,fontSize:"0.875rem",border:"none",cursor:"pointer",opacity:(posting||(!txt.trim()&&!file))?0.4:1,flexShrink:0}}>{posting?"Posting...":"Post"}</button>
        </div>
      </div>}
      <div style={{flex:1,overflowY:"auto",padding:"0.75rem 1rem",display:"flex",flexDirection:"column",gap:10}}>
        {posts.length===0
          ?<div style={{textAlign:"center",color:"#94a3b8",padding:"3rem 0"}}><div style={{fontSize:"2.5rem",marginBottom:8}}>📋</div><p style={{fontSize:"0.875rem"}}>No announcements yet</p></div>
          :posts.map(p=>{
            const{bg,c}=rb(p.role);
            const dt=new Date(p.created_at);
            const dStr=dt.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"});
            const tStr=dt.toLocaleTimeString("en-AU",{timeZone:SYD,hour:"2-digit",minute:"2-digit"});
            return(<div key={p.id} style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"0.875rem",padding:"0.75rem 1rem"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                <span style={{fontSize:"0.7rem",fontWeight:700,padding:"1px 8px",borderRadius:999,background:bg,color:c}}>{p.sender}</span>
                <span style={{fontSize:"0.65rem",color:"#94a3b8"}}>{dStr} · {tStr}</span>
                {canDel(p)&&<button onClick={()=>del(p.id)} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",fontSize:"0.75rem"}}>✕</button>}
              </div>
              {p.text&&<p style={{fontSize:"0.875rem",color:"#1e293b",lineHeight:1.6,margin:0,whiteSpace:"pre-wrap"}}>{p.text}</p>}
              {p.file&&p.file.type==="image"&&<img src={p.file.data} alt={p.file.name} style={{maxWidth:"100%",borderRadius:8,marginTop:p.text?8:0,border:"1px solid #e2e8f0"}}/>}
              {p.file&&p.file.type==="file"&&<a href={p.file.data} download={p.file.name} style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:p.text?8:0,fontSize:"0.8rem",color:"#3b82f6",textDecoration:"none",background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:6,padding:"4px 10px"}}>📄 {p.file.name}</a>}
            </div>);
          })
        }
      </div>
    </div>
  );
}

// ── Message Board ─────────────────────────────────────────────
function Messages({session}){
  const todayKey=()=>todaySyd();
  const[sel,setSel]=useState(todayKey());const[msgs,setMsgs]=useState([]);const[txt,setTxt]=useState("");
  const bottom=useRef();
  const dates=Array.from({length:7},(_,i)=>{const d=nowSyd();d.setDate(d.getDate()-i);return toKey(d);});
  const dayMsgs=msgs.filter(m=>m.date===sel).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const rb=role=>({admin:{bg:"#fee2e2",c:"#e8192c"},director:{bg:"#dbeafe",c:"#1d4ed8"},educator:{bg:"#dcfce7",c:"#15803d"}}[role]||{bg:"#f1f5f9",c:"#475569"});
  const isOwn=s=>s===(session.role==="educator"?session.empName:session.role==="admin"?"Admin":"Director");
  const load=async()=>{const{data}=await sb.from("messages").select("*").order("created_at",{ascending:true});setMsgs(data||[]);};
  useEffect(()=>{load();const sub=sb.channel("msgs_ch").on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>load()).subscribe();return()=>sb.removeChannel(sub);},[]);
  const send=async()=>{
    if(!txt.trim())return;
    const{error}=await sb.from("messages").insert({sender:session.role==="educator"?session.empName:session.role==="admin"?"Admin":"Director",role:session.role,text:txt.trim(),date:todayKey(),time:timeSyd()});
    if(error){alert("Error: "+error.message);return;}
    setTxt("");await load();setTimeout(()=>bottom.current?.scrollIntoView({behavior:"smooth"}),100);
  };
  const del=async id=>{await sb.from("messages").delete().eq("id",id);setMsgs(m=>m.filter(x=>x.id!==id));};
  const printMsgs=()=>{
    const dl=sel===todayKey()?"Today":new Date(sel+"T12:00:00").toLocaleDateString("en-AU",{timeZone:SYD,weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const rows=dayMsgs.map(m=>{const{bg,c}=rb(m.role);return"<tr><td style='padding:6px 10px;border:1px solid #e2e8f0;font-size:11px;white-space:nowrap'><span style='background:"+bg+";color:"+c+";padding:2px 8px;border-radius:999px;font-weight:700;font-size:10px'>"+m.sender+"</span></td><td style='padding:6px 10px;border:1px solid #e2e8f0;font-size:11px;color:#64748b;white-space:nowrap'>"+m.time+"</td><td style='padding:6px 10px;border:1px solid #e2e8f0;font-size:11px'>"+m.text+"</td></tr>";}).join("");
    const html="<!DOCTYPE html><html><head><title>iRSK Messages</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#1e293b;margin:24px}h1{color:"+BRAND+";font-size:18px;margin:0}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#f1f5f9;text-align:left;padding:6px 10px;font-size:11px;color:#475569;border:1px solid #e2e8f0}.footer{margin-top:24px;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:8px}</style></head><body><h1>iRSK — Message Board</h1><p style='color:#64748b;font-size:11px;margin:4px 0 0'>Rawson St Kids Early Learning Centre</p><p style='color:#334155;font-size:12px;margin:6px 0 0'><strong>"+dl+"</strong> · "+dayMsgs.length+" message"+(dayMsgs.length!==1?"s":"")+"</p><table><thead><tr><th>Sender</th><th>Time</th><th>Message</th></tr></thead><tbody>"+rows+"</tbody></table><div class='footer'>Generated by iRSK · "+fmtGen()+"</div><script>setTimeout(function(){window.print();},400);<\/script></body></html>";
    const w=window.open("","_blank");if(w){w.document.write(html);w.document.close();}
  };
  return(
    <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",height:"100%",borderTop:"3px solid #3b82f6",borderRadius:"1rem"}}>
      <div style={{padding:"0.875rem 1rem",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:"1rem",color:"#1e293b",flexShrink:0}}>💬 Messages</div>
      <div style={{padding:"0.5rem 1rem",borderBottom:"1px solid #e2e8f0",display:"flex",gap:6,flexWrap:"wrap",flexShrink:0,alignItems:"center"}}>
        {dates.map(d=>{const label=d===todayKey()?"Today":new Date(d+"T12:00:00").toLocaleDateString("en-AU",{timeZone:SYD,weekday:"short",day:"numeric",month:"short"});const has=msgs.some(m=>m.date===d);return(<button key={d} onClick={()=>setSel(d)} style={{position:"relative",padding:"3px 10px",borderRadius:999,fontSize:"0.75rem",fontWeight:sel===d?700:400,border:"1px solid "+(sel===d?BRAND:"#e2e8f0"),background:sel===d?BRAND:"white",color:sel===d?"white":"#475569",cursor:"pointer"}}>{label}{has&&<span style={{position:"absolute",top:-3,right:-3,width:8,height:8,background:"#3b82f6",borderRadius:"50%",border:"1px solid white"}}></span>}</button>);})}
        <input type="date" value={sel} onChange={e=>setSel(e.target.value)} style={{padding:"3px 8px",borderRadius:999,fontSize:"0.75rem",border:"1px solid #e2e8f0",color:"#475569",outline:"none"}}/>
        {dayMsgs.length>0&&<button onClick={printMsgs} style={{marginLeft:"auto",padding:"3px 12px",borderRadius:"0.5rem",fontSize:"0.75rem",fontWeight:500,border:"1px solid #e2e8f0",background:"white",color:"#475569",cursor:"pointer"}}>🖨️ Print</button>}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0.75rem 1rem",display:"flex",flexDirection:"column",gap:10}}>
        {dayMsgs.length===0
          ?<div style={{textAlign:"center",color:"#94a3b8",padding:"3rem 0"}}><div style={{fontSize:"2.5rem",marginBottom:8}}>💬</div><p style={{fontSize:"0.875rem"}}>No messages for {sel===todayKey()?"today":new Date(sel+"T12:00:00").toLocaleDateString("en-AU",{timeZone:SYD,weekday:"long",day:"numeric",month:"long"})}</p></div>
          :dayMsgs.map(m=>{const{bg,c}=rb(m.role);const own=isOwn(m.sender);return(
            <div key={m.id} style={{display:"flex",flexDirection:"column",alignItems:own?"flex-end":"flex-start"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                <span style={{fontSize:"0.7rem",fontWeight:700,padding:"1px 8px",borderRadius:999,background:bg,color:c}}>{m.sender}</span>
                <span style={{fontSize:"0.65rem",color:"#94a3b8"}}>{m.time}</span>
                {(session.role==="admin"||own)&&<button onClick={()=>del(m.id)} style={{fontSize:"0.65rem",background:"none",border:"none",cursor:"pointer",color:"#cbd5e1",padding:0}}>✕</button>}
              </div>
              <div style={{maxWidth:"80%",background:own?"#fee2e2":"#f1f5f9",padding:"0.5rem 0.875rem",fontSize:"0.9rem",color:"#1e293b",lineHeight:1.5,border:own?"1px solid #fecaca":"1px solid #e2e8f0",borderRadius:own?"1rem 1rem 0.25rem 1rem":"1rem 1rem 1rem 0.25rem"}}>{m.text}</div>
            </div>
          );})}
        <div ref={bottom}/>
      </div>
      <div style={{padding:"0.75rem 1rem",borderTop:"1px solid #e2e8f0",display:"flex",gap:8,flexShrink:0,alignItems:"flex-end"}}>
        <textarea value={txt} onChange={e=>setTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&(e.preventDefault(),send())} placeholder="Type a message... (Enter to send)" rows={2}
          style={{flex:1,border:"1px solid #e2e8f0",borderRadius:"0.75rem",padding:"0.625rem 0.875rem",fontSize:"1rem",outline:"none",resize:"none",lineHeight:1.5}}/>
        <button onClick={send} disabled={!txt.trim()} style={{padding:"0.625rem 1.25rem",borderRadius:"0.75rem",background:BRAND,color:"white",fontWeight:600,fontSize:"1rem",border:"none",cursor:"pointer",opacity:!txt.trim()?0.4:1,flexShrink:0}}>Send</button>
      </div>
    </div>
  );
}

// ── Shopping Lists ────────────────────────────────────────────
function ShoppingList({store,storeLabel,storeIcon,accentColor,session}){
  const[items,setItems]=useState([]);
  const[name,setName]=useState("");
  const[qty,setQty]=useState("");
  const[adding,setAdding]=useState(false);
  const senderName=session.role==="educator"?session.empName:session.role==="admin"?"Admin":"Director";
  const canRemove=session.role==="admin"||session.role==="director";
  const load=async()=>{
    const{data}=await sb.from("shopping_items").select("*").eq("store",store).order("created_at",{ascending:true});
    setItems(data||[]);
  };
  useEffect(()=>{
    load();
    const sub=sb.channel("shop_ch_"+store).on("postgres_changes",{event:"*",schema:"public",table:"shopping_items",filter:"store=eq."+store},()=>load()).subscribe();
    return()=>sb.removeChannel(sub);
  },[store]);
  const add=async()=>{
    if(!name.trim())return;
    setAdding(true);
    const{error}=await sb.from("shopping_items").insert({store,name:name.trim(),qty:qty.trim()||null,added_by:senderName});
    if(error){alert("Error adding item: "+error.message);setAdding(false);return;}
    setName("");setQty("");setAdding(false);await load();
  };
  const check=async id=>{
    if(!canRemove)return;
    setItems(it=>it.filter(x=>x.id!==id));
    await sb.from("shopping_items").delete().eq("id",id);
  };
  const fmtTime=ts=>{
    if(!ts)return"";
    const d=new Date(ts);
    return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("en-AU",{timeZone:SYD,hour:"2-digit",minute:"2-digit",hour12:true});
  };
  return(
    <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",display:"flex",flexDirection:"column",height:"100%",borderTop:"3px solid "+accentColor,borderRadius:"1rem"}}>
      <div style={{padding:"0.875rem 1rem",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:"1rem",color:"#1e293b",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
        <span>{storeIcon} {storeLabel}</span>
        <span style={{fontSize:"0.75rem",fontWeight:500,color:"#94a3b8",background:"#f1f5f9",padding:"2px 10px",borderRadius:999}}>{items.length} item{items.length!==1?"s":""}</span>
      </div>
      <div style={{padding:"0.75rem 1rem",borderBottom:"1px solid #e2e8f0",flexShrink:0}}>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <input value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Add an item..." style={{flex:1,border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.5rem 0.75rem",fontSize:"0.875rem",outline:"none",minWidth:0}}/>
          <input value={qty} onChange={e=>setQty(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Qty" style={{width:70,border:"1px solid #e2e8f0",borderRadius:"0.5rem",padding:"0.5rem 0.75rem",fontSize:"0.875rem",outline:"none"}}/>
          <button onClick={add} disabled={adding||!name.trim()} style={{padding:"0.5rem 1rem",borderRadius:"0.5rem",background:accentColor,color:"white",fontWeight:600,fontSize:"0.875rem",border:"none",cursor:"pointer",opacity:(adding||!name.trim())?0.4:1,flexShrink:0}}>+</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0.75rem 1rem",display:"flex",flexDirection:"column",gap:6}}>
        {items.length===0
          ?<div style={{textAlign:"center",color:"#94a3b8",padding:"2.5rem 0"}}><div style={{fontSize:"2.5rem",marginBottom:8}}>{storeIcon}</div><p style={{fontSize:"0.875rem",margin:0}}>List is empty</p><p style={{fontSize:"0.75rem",margin:"4px 0 0"}}>Add items above</p></div>
          :items.map(it=>(
            <div key={it.id} style={{display:"flex",alignItems:"center",gap:10,background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:"0.75rem",padding:"0.625rem 0.875rem"}}>
              {canRemove
                ?<button onClick={()=>check(it.id)} aria-label="Check off" title="Check off (removes from list)" style={{flexShrink:0,width:24,height:24,minHeight:24,borderRadius:6,border:"2px solid #cbd5e1",background:"white",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,transition:"all 0.15s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=accentColor;e.currentTarget.style.background=accentColor+"15";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#cbd5e1";e.currentTarget.style.background="white";}}>
                  <span style={{fontSize:"0.85rem",color:accentColor,fontWeight:700,opacity:0}}>✓</span>
                </button>
                :<div title="Only admin or director can remove items" style={{flexShrink:0,width:24,height:24,borderRadius:6,border:"2px solid #e2e8f0",background:"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",cursor:"not-allowed"}}>
                  <span style={{fontSize:"0.7rem",color:"#cbd5e1"}}>🔒</span>
                </div>
              }
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                  <span style={{fontSize:"0.9rem",fontWeight:500,color:"#1e293b"}}>{it.name}</span>
                  {it.qty&&<span style={{fontSize:"0.75rem",fontWeight:600,color:accentColor,background:accentColor+"15",padding:"1px 8px",borderRadius:999}}>{it.qty}</span>}
                  {it.added_by&&<span style={{fontSize:"0.7rem",fontWeight:700,color:"#7c3aed",background:"#f3e8ff",border:"1px solid #ddd6fe",padding:"1px 8px",borderRadius:999}}>👤 {it.added_by}</span>}
                </div>
                <div style={{fontSize:"0.65rem",color:"#94a3b8",marginTop:2}}>{fmtTime(it.created_at)}</div>
              </div>
            </div>
          ))
        }
      </div>
    </div>
  );
}

// ── Maintenance ───────────────────────────────────────────────
function Maintenance({session}){
  const[items,setItems]=useState([]);
  const[tab,setTab]=useState("open");
  const[desc,setDesc]=useState("");
  const[photo,setPhoto]=useState(null);
  const[pName,setPName]=useState("");
  const[posting,setPosting]=useState(false);
  const[prev,setPrev]=useState(null);
  const[delConfirm,setDelConfirm]=useState(null);
  const ref=useRef();

  const senderName=session.role==="admin"?"Admin":"Director";
  const canCreate=session.role==="director"||session.role==="admin";
  const canMarkDone=session.role==="admin"||session.role==="director";
  const canDelete=session.role==="admin"||session.role==="director";

  const load=async()=>{
    const{data}=await sb.from("maintenance").select("*").order("created_at",{ascending:false});
    setItems(data||[]);
  };
  useEffect(()=>{
    load();
    const sub=sb.channel("maint_ch").on("postgres_changes",{event:"*",schema:"public",table:"maintenance"},()=>load()).subscribe();
    return()=>sb.removeChannel(sub);
  },[]);

  const onFile=async e=>{
    const f=e.target.files[0];if(!f)return;
    if(!f.type.startsWith("image/")){alert("Please select an image file.");return;}
    if(f.size>5*1024*1024){
      if(!confirm("This image is "+(f.size/1024/1024).toFixed(1)+"MB and may slow things down. Continue anyway?"))return;
    }
    setPName(f.name);
    const b=await f2b(f);
    setPhoto({name:f.name,data:b});
  };

  const create=async()=>{
    if(!desc.trim())return;
    setPosting(true);
    const{error}=await sb.from("maintenance").insert({
      description:desc.trim(),
      photo:photo?photo.data:null,
      reported_by:senderName,
      status:"open"
    });
    if(error){alert("Error creating item: "+error.message);setPosting(false);return;}
    setDesc("");setPhoto(null);setPName("");if(ref.current)ref.current.value="";
    setPosting(false);await load();
  };

  const markDone=async id=>{
    await sb.from("maintenance").update({status:"done",done_by:senderName,done_at:new Date().toISOString()}).eq("id",id);
    await load();
  };
  const reopen=async id=>{
    await sb.from("maintenance").update({status:"open",done_by:null,done_at:null}).eq("id",id);
    await load();
  };
  const del=async id=>{
    await sb.from("maintenance").delete().eq("id",id);
    setDelConfirm(null);
    setItems(it=>it.filter(x=>x.id!==id));
  };

  const filtered=items.filter(i=>i.status===tab);
  const openCount=items.filter(i=>i.status==="open").length;
  const doneCount=items.filter(i=>i.status==="done").length;

  const fmtWhen=ts=>{
    if(!ts)return"";
    const d=new Date(ts);
    return d.toLocaleDateString("en-AU",{timeZone:SYD,day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-AU",{timeZone:SYD,hour:"2-digit",minute:"2-digit",hour12:true});
  };

  const tabBtn=(key,label,count,color)=>(
    <button onClick={()=>setTab(key)} style={{
      padding:"6px 14px",borderRadius:"0.5rem",fontSize:"0.85rem",fontWeight:600,
      border:"1px solid "+(tab===key?color:"#e2e8f0"),
      background:tab===key?color:"white",color:tab===key?"white":"#475569",cursor:"pointer",
      display:"flex",alignItems:"center",gap:8
    }}>
      {label}
      <span style={{fontSize:"0.7rem",fontWeight:700,padding:"1px 8px",borderRadius:999,background:tab===key?"rgba(255,255,255,0.25)":"#f1f5f9",color:tab===key?"white":"#94a3b8"}}>{count}</span>
    </button>
  );

  return(
    <div style={{background:"white",borderRadius:"1rem",boxShadow:"0 2px 8px rgba(0,0,0,0.07)",borderTop:"3px solid #f59e0b"}}>
      <div style={{padding:"0.875rem 1rem",borderBottom:"1px solid #e2e8f0",fontWeight:700,fontSize:"1rem",color:"#1e293b",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap"}}>
        <span>🔧 Maintenance</span>
        <span style={{fontSize:"0.7rem",fontWeight:400,color:"#94a3b8"}}>
          {canCreate?"Report items, mark complete":canMarkDone?"View & mark complete":"View only"}
        </span>
      </div>

      {canCreate&&<div style={{padding:"0.875rem 1rem",borderBottom:"1px solid #e2e8f0",background:"#fffbeb"}}>
        <label style={{fontSize:"0.7rem",fontWeight:700,color:"#92400e",textTransform:"uppercase",display:"block",marginBottom:6}}>Report a new item</label>
        <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Describe the issue (e.g. broken tap in Toddler bathroom)..." rows={3}
          style={{width:"100%",border:"1px solid #fde68a",borderRadius:"0.5rem",padding:"0.5rem 0.75rem",fontSize:"0.875rem",outline:"none",resize:"none",lineHeight:1.5,boxSizing:"border-box",marginBottom:8,background:"white"}}/>
        <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
          <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:"0.75rem",color:"#64748b",background:"white",border:"1px solid #fde68a",borderRadius:"0.5rem",padding:"0.375rem 0.75rem"}}>
            📷 {pName||"Attach photo"}
            <input type="file" accept="image/*" ref={ref} onChange={onFile} style={{display:"none"}}/>
          </label>
          {pName&&<>
            <span style={{fontSize:"0.75rem",color:"#16a34a"}}>✓ {pName}</span>
            <button onClick={()=>{setPhoto(null);setPName("");if(ref.current)ref.current.value="";}} style={{fontSize:"0.7rem",background:"none",border:"none",cursor:"pointer",color:"#94a3b8"}}>Remove</button>
          </>}
          <button onClick={create} disabled={posting||!desc.trim()} style={{marginLeft:"auto",padding:"0.4rem 1.1rem",borderRadius:"0.5rem",background:"#f59e0b",color:"white",fontWeight:600,fontSize:"0.85rem",border:"none",cursor:"pointer",opacity:(posting||!desc.trim())?0.4:1}}>
            {posting?"Submitting...":"+ Add Item"}
          </button>
        </div>
      </div>}

      <div style={{padding:"0.75rem 1rem",borderBottom:"1px solid #e2e8f0",display:"flex",gap:8,flexWrap:"wrap"}}>
        {tabBtn("open","🟠 Open",openCount,"#f59e0b")}
        {tabBtn("done","✅ Done",doneCount,"#22c55e")}
      </div>

      <div style={{padding:"1rem",display:"flex",flexDirection:"column",gap:10}}>
        {filtered.length===0
          ?<div style={{textAlign:"center",color:"#94a3b8",padding:"2.5rem 0"}}>
            <div style={{fontSize:"2.5rem",marginBottom:8}}>{tab==="open"?"🔧":"✅"}</div>
            <p style={{fontSize:"0.875rem",margin:0}}>{tab==="open"?"No open maintenance items":"No completed items yet"}</p>
          </div>
          :filtered.map(it=>(
            <div key={it.id} style={{display:"flex",gap:12,background:it.status==="done"?"#f0fdf4":"#fffbeb",border:"1px solid "+(it.status==="done"?"#bbf7d0":"#fde68a"),borderRadius:"0.75rem",padding:"0.875rem",alignItems:"flex-start"}}>
              {it.photo
                ?<img src={it.photo} onClick={()=>setPrev(it.photo)} style={{width:80,height:80,objectFit:"cover",borderRadius:8,border:"1px solid "+(it.status==="done"?"#bbf7d0":"#fde68a"),cursor:"pointer",flexShrink:0}}/>
                :<div style={{width:80,height:80,background:"#f1f5f9",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:"1.5rem",color:"#cbd5e1"}}>🔧</div>
              }
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:"0.9rem",color:"#1e293b",lineHeight:1.5,whiteSpace:"pre-wrap",marginBottom:6,textDecoration:it.status==="done"?"line-through":"none",opacity:it.status==="done"?0.7:1}}>{it.description}</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                  <span style={{fontSize:"0.7rem",fontWeight:700,padding:"2px 8px",borderRadius:999,background:"#dbeafe",color:"#1d4ed8"}}>👤 {it.reported_by||"—"}</span>
                  <span style={{fontSize:"0.7rem",color:"#94a3b8"}}>{fmtWhen(it.created_at)}</span>
                  {it.status==="done"&&<>
                    <span style={{fontSize:"0.7rem",fontWeight:700,padding:"2px 8px",borderRadius:999,background:"#dcfce7",color:"#15803d"}}>✓ Done by {it.done_by||"—"}</span>
                    {it.done_at&&<span style={{fontSize:"0.7rem",color:"#94a3b8"}}>{fmtWhen(it.done_at)}</span>}
                  </>}
                </div>
                <div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>
                  {it.status==="open"&&canMarkDone&&<button onClick={()=>markDone(it.id)} style={{padding:"4px 12px",borderRadius:6,background:"#22c55e",color:"white",fontWeight:600,fontSize:"0.75rem",border:"none",cursor:"pointer"}}>✓ Mark Done</button>}
                  {it.status==="done"&&canMarkDone&&<button onClick={()=>reopen(it.id)} style={{padding:"4px 12px",borderRadius:6,background:"#f1f5f9",color:"#475569",fontWeight:500,fontSize:"0.75rem",border:"1px solid #e2e8f0",cursor:"pointer"}}>↺ Reopen</button>}
                  {canDelete&&(delConfirm===it.id
                    ?<>
                      <button onClick={()=>del(it.id)} style={{padding:"4px 10px",borderRadius:6,background:"#ef4444",color:"white",fontWeight:600,fontSize:"0.75rem",border:"none",cursor:"pointer"}}>Delete?</button>
                      <button onClick={()=>setDelConfirm(null)} style={{padding:"4px 10px",borderRadius:6,background:"#e2e8f0",color:"#475569",fontSize:"0.75rem",border:"none",cursor:"pointer"}}>Cancel</button>
                    </>
                    :<button onClick={()=>setDelConfirm(it.id)} style={{padding:"4px 10px",borderRadius:6,background:"none",color:"#cbd5e1",fontSize:"0.75rem",border:"1px solid #e2e8f0",cursor:"pointer"}}>✕</button>
                  )}
                </div>
              </div>
            </div>
          ))
        }
      </div>

      {prev&&<div onClick={()=>setPrev(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
        <div style={{position:"relative",maxWidth:800,width:"100%"}}>
          <img src={prev} style={{width:"100%",borderRadius:12,maxHeight:"85vh",objectFit:"contain"}}/>
          <button onClick={()=>setPrev(null)} style={{position:"absolute",top:8,right:8,background:"white",border:"none",borderRadius:"50%",width:36,height:36,fontWeight:700,cursor:"pointer",fontSize:"1rem"}}>✕</button>
        </div>
      </div>}
    </div>
  );
}
